name: blog-infra

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: blog-postgres
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
    ports:
      - "5432:5432"
    volumes:
      - ../deploy/.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: blog-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-blog_redis}"]
    ports:
      - "6379:6379"
    volumes:
      - ../deploy/.data/redis:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: blog-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-blog_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-blog_minio_password}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../deploy/.data/minio:/data
    restart: unless-stopped
