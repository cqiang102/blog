name: personal-blog

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: blog-postgres
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: blog-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - blog-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: blog-minio
    environment:
      MINIO_ROOT_USER: blog_minio
      MINIO_ROOT_PASSWORD: blog_minio_password
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - blog-minio-data:/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: blog-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost/minio
      MINIO_ACCESS_KEY: blog_minio
      MINIO_SECRET_KEY: blog_minio_password
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-in-production}
      ADMIN_BOOTSTRAP_ENABLED: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-站长}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../apps/web_flutter
      dockerfile: Dockerfile
    container_name: blog-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  blog-postgres-data:
  blog-redis-data:
  blog-minio-data:
