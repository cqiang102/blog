name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Java 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            apps/api/pom.xml
            apps/api/.mvn/wrapper/maven-wrapper.properties

      - name: Require Docker for Testcontainers
        run: docker info

      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipApiDocs=true

  frontend:
    name: Frontend / Flutter 3.35.4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web_flutter
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Flutter 3.35.4
        # Pinned commit for subosito/flutter-action v2.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true
          pub-cache: true

      - name: Set up FVM 3.2.1
        run: |
          dart pub global activate fvm 3.2.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install locked Flutter SDK
        run: fvm install --skip-pub-get

      - name: Show locked Flutter toolchain
        run: |
          fvm flutter config --no-analytics
          fvm flutter --version

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Check Dart formatting
        run: fvm dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter code
        run: fvm flutter analyze

      - name: Run Flutter tests
        run: fvm flutter test

      - name: Build Flutter Web
        run: fvm flutter build web --release --wasm --tree-shake-icons --dart-define=API_BASE_URL=/api/v1
