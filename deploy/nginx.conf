map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_real_ip $upstream_real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;
    gzip_min_length 256;

    # API proxy
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $upstream_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # MinIO 文件代理（预签名 URL 经由此路径访问）
    location ^~ /minio/ {
        proxy_pass http://minio:9000/;
        # MinIO presigned URLs are generated against the internal endpoint.
        # Preserve that signed Host while exposing the URL through /minio/.
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $upstream_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Flutter web app - SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter 主入口 - 短期缓存（可能更新）
    location = /main.dart.js {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Flutter WASM 和 JS 资源 - 长期缓存（带 hash）
    location ~* \.(wasm|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript";
    }

    # 字体文件 - 长期缓存
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # 图片资源 - 长期缓存
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS 文件 - 长期缓存
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
