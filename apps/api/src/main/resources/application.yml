spring:
  application:
    name: personal-blog-api
  threads:
    # Use Java 25 virtual threads for framework-managed request and task execution.
    # AI streaming concurrency remains bounded by its dedicated executor (see AsyncConfig).
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MEDIA_MAX_UPLOAD_SIZE:50MB}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          connectiontimeout: 5000
          timeout: 5000
  ai:
    model:
      embedding: ollama
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
        max-tokens: ${OPENAI_MAX_TOKENS:131072}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      type: ${AI_VECTORSTORE_TYPE:none}
      pgvector:
        initialize-schema: false
        dimensions: 768
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  max-http-request-header-size: 8KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

blog:
  feed:
    title: ${BLOG_FEED_TITLE:沐凉·日记}
    author: ${BLOG_FEED_AUTHOR:沐凉}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS}
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  ai:
    daily-question-limit: ${AI_DAILY_QUESTION_LIMIT:10}
    knowledge-min-similarity: ${AI_KNOWLEDGE_MIN_SIMILARITY:0.60}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE}
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:}

dromara:
  x-file-storage:
    default-platform: qiniu-private
    qiniu-kodo:
      - platform: qiniu-private
        enable-storage: true
        access-key: ${QINIU_ACCESS_KEY:test-qiniu}
        secret-key: ${QINIU_SECRET_KEY:test-qiniu-secret}
        bucket-name: ${QINIU_PRIVATE_BUCKET:lacia-private}
        domain: ${QINIU_PRIVATE_DOMAIN:https://file.lacia.cn/}
        base-path: uploads/
