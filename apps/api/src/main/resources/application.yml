spring:
  application:
    name: personal-blog-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:blog}
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:blog}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:#{null}}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MEDIA_MAX_UPLOAD_SIZE:50MB}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:your-qq-email@qq.com}
    password: ${MAIL_PASSWORD:your-smtp-authorization-code}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          connectiontimeout: 5000
          timeout: 5000
  ai:
    model:
      embedding: ollama
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:sk-local-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
        max-tokens: ${OPENAI_MAX_TOKENS:131072}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      type: none
      pgvector:
        initialize-schema: false
        dimensions: 768
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 启用虚拟线程处理 HTTP 请求（Java 21 + Spring Boot 3.2+）。
    # 虚拟线程适合 IO 密集型场景（如数据库查询、外部 API 调用），可大幅降低线程上下文切换开销。
    # AI 流式对话等需要精细控制并发的场景仍使用专用线程池（见 AsyncConfig）。
    threads:
      virtual: ${VIRTUAL_THREADS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

blog:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  ai:
    daily-question-limit: ${AI_DAILY_QUESTION_LIMIT:10}
    knowledge-min-similarity: ${AI_KNOWLEDGE_MIN_SIMILARITY:0.60}
  security:
    jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}

dromara:
  x-file-storage:
    default-platform: minio-1
    minio:
      - platform: minio-1
        enable-storage: true
        access-key: ${MINIO_ACCESS_KEY:blog_minio}
        secret-key: ${MINIO_SECRET_KEY:blog_minio_password}
        end-point: ${MINIO_ENDPOINT:http://localhost:9000}
        bucket-name: ${MINIO_BUCKET:blog-media}
        domain: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}/${MINIO_BUCKET:blog-media}/
        base-path: uploads/
