spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  ai:
    model:
      embedding: ollama
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
        max-tokens: ${OPENAI_MAX_TOKENS:131072}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      type: pgvector

server:
  port: ${SERVER_PORT:8080}
  # Forwarded headers are resolved only by ClientIpResolver after checking TRUSTED_PROXY_CIDRS.
  forward-headers-strategy: none
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
    shutdown:
      enabled: true

blog:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS}
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      nickname: ${ADMIN_NICKNAME:站长}
  ai:
    daily-question-limit: ${AI_DAILY_QUESTION_LIMIT:10}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:}

dromara:
  x-file-storage:
    default-platform: minio-1
    minio:
      - platform: minio-1
        enable-storage: true
        access-key: ${MINIO_ACCESS_KEY}
        secret-key: ${MINIO_SECRET_KEY}
        end-point: ${MINIO_ENDPOINT}
        bucket-name: ${MINIO_BUCKET:blog-media}
        domain: ${MINIO_PUBLIC_ENDPOINT}/${MINIO_BUCKET:blog-media}/
        base-path: uploads/
