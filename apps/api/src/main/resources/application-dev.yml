spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:blog}
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:blog}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:blog_redis}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:your-qq-email@qq.com}
    password: ${MAIL_PASSWORD:your-smtp-authorization-code}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-local-placeholder}

logging:
  level:
    com.caoqiang.blog: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

blog:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  security:
    jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      email: ${ADMIN_EMAIL:admin@example.com}
      password: ${ADMIN_PASSWORD:change-me-local-admin-password}
      nickname: ${ADMIN_NICKNAME:站长}

dromara:
  x-file-storage:
    minio:
      - platform: minio-1
        enable-storage: true
        access-key: ${MINIO_ACCESS_KEY:blog_minio}
        secret-key: ${MINIO_SECRET_KEY:blog_minio_password}
        end-point: ${MINIO_ENDPOINT:http://localhost:9000}
        bucket-name: ${MINIO_BUCKET:blog-media}
        domain: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}/${MINIO_BUCKET:blog-media}/
        base-path: uploads/
