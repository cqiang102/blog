spring:
  data:
    redis:
      password: ${REDIS_PASSWORD:blog_redis}
  jpa:
    show-sql: true

logging:
  level:
    com.caoqiang.blog: DEBUG
    org.springframework.security: INFO

blog:
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      email: ${ADMIN_EMAIL:admin@example.com}
      password: ${ADMIN_PASSWORD:admin123456}
      nickname: ${ADMIN_NICKNAME:站长}
