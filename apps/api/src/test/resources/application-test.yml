spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/blog_test
    username: blog_test
    password: blog_test
  data:
    redis:
      host: localhost
      port: 6379
      password: blog_test
  mail:
    host: localhost
    port: 2525
    username: test@example.invalid
    password: test-mail-password
  ai:
    openai:
      api-key: test-openai-api-key

blog:
  frontend:
    base-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
  security:
    jwt-secret: test-only-jwt-secret-with-at-least-32-characters
    refresh-cookie-secure: false

dromara:
  x-file-storage:
    default-platform: qiniu-private
    qiniu-kodo:
      - platform: qiniu-private
        enable-storage: true
        access-key: ${QINIU_ACCESS_KEY:test-qiniu}
        secret-key: ${QINIU_SECRET_KEY:test-qiniu-secret}
        bucket-name: ${QINIU_PRIVATE_BUCKET:lacia-private}
        domain: ${QINIU_PRIVATE_DOMAIN:https://file.lacia.cn/}
        base-path: uploads/
