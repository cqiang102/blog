name: personal_blog_web
description: Flutter Web client for a personal blog with AI assistant.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  animated_text_kit: ^4.2.2
  cached_network_image: ^3.4.1
  collection: ^1.19.0
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.3.2
  flutter_web_plugins:
    sdk: flutter
  go_router: ^16.0.0
  highlight: ^0.7.0
  hugeicons: ^1.1.7
  intl: ^0.20.2
  json_annotation: ^4.9.0
  markdown: ^7.3.1
  shared_preferences: ^2.3.3
  timelines_plus: ^2.0.0
  url_launcher: ^6.3.1
  video_player: ^2.9.3
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
