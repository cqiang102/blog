name: personal_blog_web
description: Flutter Web client for a personal blog with AI assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.4
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
